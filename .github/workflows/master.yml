name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi gdb tmate

      - name: Launch tmate manually
        run: |
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait-activity
          echo "=== ССЫЛКИ ДЛЯ ПОДКЛЮЧЕНИЯ ==="
          tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}'
          tmate -S /tmp/tmate.sock display -p '#{tmate_web}'
          echo "============================="
          # Заставляем машину ждать, пока вы работаете в консоли
          while [ ! -f /tmp/continue ]; do sleep 2; done

      - name: Build
        run: |
          sh build.sh

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-binaries
          path: output/
