name: Build
on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare
        run: |
          sudo apt-get update
          sudo apt-get install gcc-arm-linux-gnueabi gdb

      - name: Build
        run: |
          sh build.sh
          
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: u-boot-binaries
          path: output/

